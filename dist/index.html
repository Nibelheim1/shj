<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <link rel="icon" href="data:," />
  <title>小动物山海经 · 疗愈所</title>
  <link rel="stylesheet" href="merge-slice.css" />
</head>
<body>
<div id="slice-app">
  <header class="slice-hud" aria-label="玩家状态">
    <div class="brand-mark"><span class="brand-leaf" aria-hidden="true">✦</span><span>山海疗愈所</span></div>
    <div id="hud-values" class="hud-values"></div>
    <button id="reset-btn" class="icon-button" type="button" aria-label="重置进度">↺</button>
  </header>

  <main id="slice-main">
    <section id="merge-view" class="view active" aria-labelledby="merge-title">
      <div class="view-heading">
        <div><span class="eyebrow">今日接诊 · 穷奇疗愈篇</span><h1 id="merge-title">把药物合成出来</h1></div>
        <button id="energy-help" class="pill-button" type="button" aria-label="打开体力中心">体力中心</button>
      </div>

      <section class="order-panel" aria-labelledby="orders-title">
        <div class="section-title-row"><div><span class="eyebrow">多线委托</span><h2 id="orders-title">患者正在等待你的处方</h2></div><span class="small-note">点击图标查看详情</span></div>
        <div id="order-list" class="order-list" aria-live="polite"></div>
      </section>

      <section class="board-card" aria-labelledby="board-title">
        <div class="board-topline"><div><strong id="board-title">合成棋盘</strong><span id="space-note"></span></div><button id="organize-btn" class="text-button" type="button" aria-label="整理棋盘">整理棋盘</button></div>
        <div id="merge-board" class="merge-board" role="grid" aria-label="合成棋盘"></div>
        <div id="selection-hint" class="selection-hint">点击同阶同类物品即可合成；生成器也在棋盘中</div>
        <div id="item-info-root" class="item-info-root" aria-live="polite"></div>
      </section>
    </section>

    <section id="yard-view" class="view" aria-labelledby="yard-heading">
      <div class="yard-scene" id="yard-scene">
        <div class="yard-sky-copy"><span class="eyebrow">庭院回声 · 点击互动</span><h1 id="yard-heading">庭院疗愈目标</h1><p id="yard-copy">当前动作：观察四周</p></div>
        <div class="yard-path" aria-hidden="true"></div>
        <button id="yard-character" class="yard-character" type="button" aria-label="安抚穷奇"><img id="yard-beast" alt="穷奇" /></button>
        <div class="yard-speech" id="yard-speech">“别靠近……我会自己好的。”</div>
        <div class="yard-hotspots">
          <button data-hotspot="clinic" type="button" aria-label="查看医馆病历">🏯<b>医馆</b><small>查看病历</small></button>
          <button data-hotspot="herb" type="button" aria-label="访问药圃">🌱<b>药圃</b><small>访问目标</small></button>
          <button data-hotspot="groom" type="button" aria-label="前往梳洗台">🪮<b>梳洗台</b><small>准备互动</small></button>
        </div>
        <div class="yard-interact">
          <button id="care-groom" type="button" aria-label="开始梳理挑战">🪮 <b>梳理</b><small>完成一次</small></button>
          <button id="care-play" type="button" aria-label="开始陪玩挑战">🎐 <b>陪玩</b><small>完成一次</small></button>
        </div>
        <div class="yard-props" aria-hidden="true"><span class="prop prop-pool">≈</span><span class="prop prop-flower">✿</span><span class="prop prop-lantern">♨</span></div>
      </div>

      <section class="yard-goal-panel" aria-labelledby="yard-goal-title">
        <div class="section-title-row"><div><span class="eyebrow">庭院主线 · 今日目标</span><h2 id="yard-goal-title">让穷奇愿意留下</h2></div><span id="yard-goal-reward" class="small-note">完成得 +8 体力 · +1 净化刷 · 随机药材</span></div>
        <div id="yard-goals" class="yard-goals"></div>
        <button id="claim-yard-goal" class="goal-claim" type="button" aria-label="领取庭院目标奖励">领取今日奖励</button>
      </section>

      <section class="progress-card compact-progress" aria-label="穷奇关系进度">
        <div class="progress-head"><div><span class="eyebrow">穷奇 · 病历与关系</span><h2 id="beast-stage">警戒期</h2></div><span id="bond-level" class="stage-chip">信任 Lv1</span></div>
        <div class="progress-row"><span>信任</span><div class="meter"><i id="trust-meter"></i></div><b id="trust-value">0/100</b></div>
        <div class="progress-row"><span>疗愈</span><div class="meter heal"><i id="heal-meter"></i></div><b id="heal-value">0/100</b></div>
        <div id="yard-reward" class="yard-reward">完成委托后，庭院会记住这次照料。</div>
      </section>

      <section class="building-card compact-buildings" aria-labelledby="building-title">
        <div class="section-title-row"><div><span class="eyebrow">支线 · 庭院建设</span><h2 id="building-title">疗愈所设施</h2></div><span class="small-note">点击查看详情</span></div>
        <div id="building-list" class="building-list"></div>
      </section>
    </section>
  </main>

  <nav class="slice-nav" aria-label="页面导航">
    <button class="nav-button active" data-view="merge-view" type="button" aria-label="打开合成页"><span aria-hidden="true">▦</span><small>合成</small></button>
    <button class="nav-button" data-view="yard-view" type="button" aria-label="打开庭院页"><span aria-hidden="true">⌂</span><small>庭院</small></button>
    <div class="nav-goal"><span id="goal-progress">主线治疗进度 · 0%</span><i><em id="goal-bar"></em></i></div>
  </nav>

  <div id="toast-root" aria-live="polite"></div>
  <div id="guide-root"></div>
  <div id="modal-root"></div>
</div>
<script src="merge-slice.js"></script>
</body>
</html>
